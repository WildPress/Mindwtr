# WildPress fork automation (not from upstream).
#
# Keeps this fork's `main` current with upstream stable releases while carrying
# the reminder-webhook add-on, runs the cloud + core test gate, and — only when
# the gate passes — publishes the cloud image to GHCR so gaia can `docker pull`.
#
# This is the ONLY workflow this fork runs; the inherited upstream workflows
# (releases, notarisation, store publishing, native builds) are disabled.
name: Upstream sync + cloud image

on:
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build and publish the cloud image even if there is no new upstream release'
        type: boolean
        default: false

permissions:
  contents: write # push the merge commit to main
  packages: write # push the cloud image to GHCR
  issues: write # file an issue when a sync conflicts or the gate fails

concurrency:
  group: upstream-webhook-sync
  cancel-in-progress: false

env:
  UPSTREAM: dongdongbh/mindwtr

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve latest upstream stable release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable release: $tag"

      - name: Fetch the release tag from upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream "refs/tags/${{ steps.rel.outputs.tag }}:refs/tags/${{ steps.rel.outputs.tag }}"

      - name: Decide whether an update is needed
        id: need
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${{ steps.rel.outputs.tag }}" HEAD; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.rel.outputs.tag }} is already integrated into main."
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release ${{ steps.rel.outputs.tag }} to integrate."
          fi

      - name: Merge the upstream release into main
        id: merge
        if: steps.need.outputs.update == 'true'
        run: |
          set -euo pipefail
          git config user.name "wildpress-sync[bot]"
          git config user.email "wildpress-sync@users.noreply.github.com"
          if ! git merge --no-edit "${{ steps.rel.outputs.tag }}"; then
            git merge --abort || true
            echo "The webhook add-on conflicts with ${{ steps.rel.outputs.tag }}." >&2
            exit 1
          fi

      - name: File an issue on merge conflict
        if: failure() && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Upstream sync conflict: ${{ steps.rel.outputs.tag }}" \
            --body "Merging upstream \`${{ steps.rel.outputs.tag }}\` into \`main\` hit conflicts (most likely \`apps/cloud/src/server.ts\` or \`server-config.ts\`, where the reminder webhook add-on lives). Resolve locally and push \`main\`:

          \`\`\`
          git fetch upstream --tags
          git checkout main && git merge ${{ steps.rel.outputs.tag }}
          # resolve, commit, run the cloud+core gate, then: git push origin main
          \`\`\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Everything below runs when we merged a new release OR when a manual run
      # asked to (re)build the image for whatever main is at now.
      - name: Setup Bun
        if: steps.need.outputs.update == 'true' || github.event.inputs.force_build == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        if: steps.need.outputs.update == 'true' || github.event.inputs.force_build == 'true'
        run: bun install --frozen-lockfile

      - name: Gate — typecheck, lint and tests (core + cloud)
        id: gate
        if: steps.need.outputs.update == 'true' || github.event.inputs.force_build == 'true'
        run: |
          set -e
          bun run --filter @mindwtr/core typecheck
          bun run --filter mindwtr-cloud typecheck
          bun run --filter mindwtr-cloud lint
          bun run --filter @mindwtr/core test
          bun test --cwd apps/cloud

      - name: File an issue on gate failure
        if: failure() && steps.gate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Upstream sync tests failed: ${{ steps.rel.outputs.tag }}" \
            --body "The cloud+core gate failed after merging upstream \`${{ steps.rel.outputs.tag }}\`. **No image was published** and \`main\` was **not** pushed, so the live deployment is unaffected. Investigate the run and decide whether the webhook add-on needs updating for this release.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Push updated main
        if: steps.need.outputs.update == 'true' && steps.gate.outcome == 'success'
        run: git push origin main

      - name: Lowercase image name
        id: img
        if: steps.gate.outcome == 'success'
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/mindwtr-cloud" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.gate.outcome == 'success'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the cloud image
        if: steps.gate.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cloud/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.rel.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
